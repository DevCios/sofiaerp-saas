# ==============================================================================
# SOFIA ERP — Configuración Global de Prometheus
# Scrapes de Control Plane, PostgreSQL, Nginx y Node Exporter
# ==============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # 1. SOFIA Control Plane API
  - job_name: 'sofia-control-plane'
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['control-plane-api:8000']

  # 2. Base de Datos Central y Tenants (PostgreSQL Exporter)
  - job_name: 'sofia-postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # 3. Métricas de Servidor Host (Node Exporter)
  - job_name: 'sofia-node'
    static_configs:
      - targets: ['node-exporter:9100']

  # 4. Métricas de Edge Proxy (Nginx)
  - job_name: 'sofia-nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
