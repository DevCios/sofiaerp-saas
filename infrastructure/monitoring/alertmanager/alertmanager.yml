global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity', 'tenant_slug']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'sofia-ops-team'

receivers:
  - name: 'sofia-ops-team'
    webhook_configs:
      - url: 'http://control-plane-api:8000/api/v1/alerts/webhook'
        send_resolved: true
