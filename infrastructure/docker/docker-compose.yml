# ==============================================================================
# SOFIA ERP — Orquestación de Infraestructura Base (Docker Compose)
# Modelo de Aislamiento de Redes y Servicios de Plataforma
# ==============================================================================

networks:
  # Red perimetral pública (solo expone Nginx a Internet)
  sofia-net-public:
    driver: bridge
  # Red interna de aplicaciones (Nginx <-> FastAPI / Odoo)
  sofia-net-app:
    driver: bridge
    internal: true
  # Red interna de datos (FastAPI / Celery / Odoo <-> Postgres / PgBouncer / Redis)
  sofia-net-data:
    driver: bridge
    internal: true

volumes:
  postgres_central_data:
  postgres_tenants_data:
  redis_data:
  sofia_filestores:
  sofia_backups:
  sofia_sunat_storage:
  nginx_ssl_certs:

services:
  # ----------------------------------------------------------------------------
  # 1. Edge Reverse Proxy & Dynamic Router (Nginx)
  # ----------------------------------------------------------------------------
  edge-router:
    image: nginx:1.27-alpine
    container_name: sofia-edge-router
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - sofia-net-public
      - sofia-net-app
    depends_on:
      - control-plane-api
      - odoo-runtime

  # ----------------------------------------------------------------------------
  # 2. Control Plane API (SOFIA Platform Backend - FastAPI)
  # ----------------------------------------------------------------------------
  control-plane-api:
    build:
      context: ../../control-plane/backend
      dockerfile: Dockerfile
    container_name: sofia-control-plane-api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - APP_SECRET_KEY=${APP_SECRET_KEY:-sofia_change_this_secret_key_in_env}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-sofia_internal_mesh_key_change_in_prod}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-https://api.sofiaerp.com,https://sofiaerp.com,https://admin.sofiaerp.com}
      - SOFIA_SUPERADMIN_EMAIL=${SOFIA_SUPERADMIN_EMAIL:-admin@sofiaerp.com}
      - SOFIA_SUPERADMIN_PASSWORD=${SOFIA_SUPERADMIN_PASSWORD:-SofiaAdmin2026!}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    volumes:
      - ../../control-plane/keys:/etc/sofia/keys:ro
      - ../../control-plane/backend/app:/app/app
      - sofia_filestores:/var/lib/sofia/filestores
      - sofia_backups:/var/lib/sofia/backups
    networks:
      - sofia-net-public
      - sofia-net-app
      - sofia-net-data
    depends_on:
      - postgres
      - redis

  # ----------------------------------------------------------------------------
  # 3. Control Plane Celery Worker (Aprovisionamiento y Tareas Pesadas)
  # ----------------------------------------------------------------------------
  control-plane-worker:
    build:
      context: ../../control-plane/backend
      dockerfile: Dockerfile
    container_name: sofia-control-plane-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --beat --loglevel=info --concurrency=1
    environment:
      - ENVIRONMENT=production
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-sofia_internal_mesh_key_change_in_prod}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - ODOO_DB_USER=${POSTGRES_USER}
    volumes:
      - ../../control-plane/backend/app:/app/app
      - sofia_filestores:/var/lib/sofia/filestores
      - sofia_backups:/var/lib/sofia/backups
      - ./backups/rclone.conf:/etc/sofia/rclone/rclone.conf:ro
    networks:
      - sofia-net-public
      - sofia-net-data
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping --timeout=5 | grep -q pong"]
      interval: 45s
      timeout: 15s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 4. Connection Pooler (PgBouncer)
  # ----------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: sofia-pgbouncer
    restart: unless-stopped
    environment:
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=250
      - DEFAULT_POOL_SIZE=20
    networks:
      - sofia-net-app
      - sofia-net-data
    depends_on:
      - postgres

  # ----------------------------------------------------------------------------
  # 5. Motor de Base de Datos Relacional (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sofia-postgres
    restart: unless-stopped
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_central_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - sofia-net-data
    # NOTA DE SEGURIDAD: Cero puertos expuestos a Internet (solo accesible vía red sofia-net-data)

  # ----------------------------------------------------------------------------
  # 6. Almacén en Memoria / Broker de Mensajería (Redis 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sofia-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - sofia-net-data
    # NOTA DE SEGURIDAD: Cero puertos expuestos a Internet

  # ----------------------------------------------------------------------------
  # 7. Odoo 20 Community Runtime Pool (Shared Protected)
  # ----------------------------------------------------------------------------
  odoo-runtime:
    build:
      context: ./odoo
      dockerfile: Dockerfile
    image: sofia-odoo-runtime:20.0
    container_name: sofia-odoo-runtime-shared
    restart: unless-stopped
    command: odoo --http-interface=0.0.0.0 --http-port=8069 -c /etc/odoo/odoo.conf
    environment:
      - HOST=pgbouncer
      - PORT=5432
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-sofia_internal_mesh_key_change_in_prod}
      - SOFIA_GATEWAY_URL=http://sunat-gateway-api:8010
    volumes:
      - sofia_filestores:/var/lib/odoo
      - ./odoo/odoo.conf:/etc/odoo/odoo.conf:ro
      - ../../control-plane/keys:/etc/sofia/keys:ro
      - ../../products:/mnt/products:ro
    networks:
      - sofia-net-public
      - sofia-net-app
      - sofia-net-data
    depends_on:
      - pgbouncer

  # ----------------------------------------------------------------------------
  # 8. SOFIA SUNAT Gateway API (Caja Negra Multi-App - gateway.sofiaerp.com)
  # ----------------------------------------------------------------------------
  sunat-gateway-api:
    build:
      context: ../../sunat-gateway
      dockerfile: Dockerfile
    container_name: sofia-sunat-gateway-api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - APP_NAME=${SUNAT_GATEWAY_APP_NAME:-API SUNAT}
      - PUBLIC_BASE_URL=${SUNAT_GATEWAY_PUBLIC_URL:-https://apisunat.pro}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/sofia_sunat_gateway_db
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/sofia_sunat_gateway_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/3
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/3
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/4
      - SUNAT_VAULT_MASTER_KEY=${SUNAT_VAULT_MASTER_KEY:-sofia_change_vault_master_key_in_env}
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET:-sofia_change_gateway_jwt_secret_in_env}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-sofia_internal_mesh_key_change_in_prod}
      - GATEWAY_ADMIN_EMAIL=${SOFIA_SUPERADMIN_EMAIL:-admin@sofiaerp.com}
      - GATEWAY_ADMIN_PASSWORD=${SOFIA_SUPERADMIN_PASSWORD:-SofiaAdmin2026!}
      - MP_ACCESS_TOKEN=${MP_ACCESS_TOKEN:-}
      - MP_WEBHOOK_SECRET=${MP_WEBHOOK_SECRET:-}
      - SOFIA_CONTROL_PLANE_URL=http://control-plane-api:8000
      - DECOLECTA_TOKEN=${DECOLECTA_TOKEN:-}
      - APIS_NET_PE_TOKEN=${APIS_NET_PE_TOKEN:-}
      - APISPERU_TOKEN=${APISPERU_TOKEN:-}
    volumes:
      - ../../sunat-gateway/app:/app/app
      - sofia_sunat_storage:/var/lib/sofia-sunat/storage
    networks:
      - sofia-net-public
      - sofia-net-app
      - sofia-net-data
    depends_on:
      - postgres
      - redis

  # ----------------------------------------------------------------------------
  # 9. SOFIA SUNAT Gateway Worker (Colas Resilientes, Nocturno y Anti-1033)
  # ----------------------------------------------------------------------------
  sunat-gateway-worker:
    build:
      context: ../../sunat-gateway
      dockerfile: Dockerfile
    container_name: sofia-sunat-gateway-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --beat -Q sunat_realtime,sunat_retry,sunat_night_batch,sunat_webhooks --loglevel=info --concurrency=1
    environment:
      - ENVIRONMENT=production
      - PUBLIC_BASE_URL=${SUNAT_GATEWAY_PUBLIC_URL:-https://apisunat.pro}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/sofia_sunat_gateway_db
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/sofia_sunat_gateway_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/3
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/3
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/4
      - SUNAT_VAULT_MASTER_KEY=${SUNAT_VAULT_MASTER_KEY:-sofia_change_vault_master_key_in_env}
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET:-sofia_change_gateway_jwt_secret_in_env}
      - DECOLECTA_TOKEN=${DECOLECTA_TOKEN:-}
      - APIS_NET_PE_TOKEN=${APIS_NET_PE_TOKEN:-}
      - APISPERU_TOKEN=${APISPERU_TOKEN:-}
    volumes:
      - ../../sunat-gateway/app:/app/app
      - sofia_sunat_storage:/var/lib/sofia-sunat/storage
    networks:
      - sofia-net-public
      - sofia-net-data
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping --timeout=5 | grep -q pong"]
      interval: 45s
      timeout: 15s
      retries: 3
      start_period: 20s
