# ==============================================================================
# SOFIA ERP — Orquestación de Infraestructura Base (Docker Compose)
# Modelo de Aislamiento de Redes y Servicios de Plataforma
# ==============================================================================

networks:
  # Red perimetral pública (solo expone Nginx a Internet)
  sofia-net-public:
    driver: bridge
  # Red interna de aplicaciones (Nginx <-> FastAPI / Odoo)
  sofia-net-app:
    driver: bridge
    internal: true
  # Red interna de datos (FastAPI / Celery / Odoo <-> Postgres / PgBouncer / Redis)
  sofia-net-data:
    driver: bridge
    internal: true

volumes:
  postgres_central_data:
  postgres_tenants_data:
  redis_data:
  sofia_filestores:
  sofia_backups:
  nginx_ssl_certs:

services:
  # ----------------------------------------------------------------------------
  # 1. Edge Reverse Proxy & Dynamic Router (Nginx)
  # ----------------------------------------------------------------------------
  edge-router:
    image: nginx:1.27-alpine
    container_name: sofia-edge-router
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - sofia-net-public
      - sofia-net-app
    depends_on:
      - control-plane-api
      - odoo-runtime

  # ----------------------------------------------------------------------------
  # 2. Control Plane API (SOFIA Platform Backend - FastAPI)
  # ----------------------------------------------------------------------------
  control-plane-api:
    build:
      context: ../../control-plane/backend
      dockerfile: Dockerfile
    container_name: sofia-control-plane-api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    volumes:
      - ../../control-plane/keys:/etc/sofia/keys:ro
      - ../../control-plane/backend/app:/app/app
      - sofia_filestores:/var/lib/sofia/filestores
      - sofia_backups:/var/lib/sofia/backups
    networks:
      - sofia-net-app
      - sofia-net-data
    depends_on:
      - postgres
      - redis

  # ----------------------------------------------------------------------------
  # 3. Control Plane Celery Worker (Aprovisionamiento y Tareas Pesadas)
  # ----------------------------------------------------------------------------
  control-plane-worker:
    build:
      context: ../../control-plane/backend
      dockerfile: Dockerfile
    container_name: sofia-control-plane-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - ODOO_DB_USER=${POSTGRES_USER}
    volumes:
      - sofia_filestores:/var/lib/sofia/filestores
      - sofia_backups:/var/lib/sofia/backups
      - ./backups/rclone.conf:/etc/sofia/rclone/rclone.conf:ro
    networks:
      - sofia-net-data
    depends_on:
      - postgres
      - redis

  # ----------------------------------------------------------------------------
  # 4. Connection Pooler (PgBouncer)
  # ----------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: sofia-pgbouncer
    restart: unless-stopped
    environment:
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=250
      - DEFAULT_POOL_SIZE=20
    networks:
      - sofia-net-app
      - sofia-net-data
    depends_on:
      - postgres

  # ----------------------------------------------------------------------------
  # 5. Motor de Base de Datos Relacional (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sofia-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_central_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - sofia-net-data
    # NOTA DE SEGURIDAD: Cero puertos expuestos a Internet (solo accesible vía red sofia-net-data)

  # ----------------------------------------------------------------------------
  # 6. Almacén en Memoria / Broker de Mensajería (Redis 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sofia-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - sofia-net-data
    # NOTA DE SEGURIDAD: Cero puertos expuestos a Internet

  # ----------------------------------------------------------------------------
  # 7. Odoo 20 Community Runtime Pool (Shared Protected)
  # ----------------------------------------------------------------------------
  odoo-runtime:
    build:
      context: ./odoo
      dockerfile: Dockerfile
    image: sofia-odoo-runtime:20.0
    container_name: sofia-odoo-runtime-shared
    restart: unless-stopped
    command: odoo --http-interface=0.0.0.0 --http-port=8069 -c /etc/odoo/odoo.conf
    environment:
      - HOST=pgbouncer
      - PORT=5432
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - sofia_filestores:/var/lib/odoo
      - ./odoo/odoo.conf:/etc/odoo/odoo.conf:ro
      - ../../control-plane/keys:/etc/sofia/keys:ro
      - ../../products:/mnt/products:ro
    networks:
      - sofia-net-app
      - sofia-net-data
    depends_on:
      - pgbouncer
