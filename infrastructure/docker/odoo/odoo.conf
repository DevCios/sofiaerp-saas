[options]
; ==============================================================================
; SOFIA ERP — Configuración de Seguridad y Rendimiento para Odoo 20 Community
; Multi-Tenant Shared Protected Pool
; ==============================================================================

; ------------------------------------------------------------------------------
; Conexión a Base de Datos (a través de PgBouncer)
; ------------------------------------------------------------------------------
db_host = pgbouncer
db_port = 5432
db_maxconn = 30
db_template = template1

; ------------------------------------------------------------------------------
; Seguridad de Aislamiento Multi-Tenant (Inquebrantable)
; ------------------------------------------------------------------------------
; Prohibido listar bases de datos al público exterior
list_db = False

; Modo Proxy y Puertos de Red
proxy_mode = True
http_interface = 0.0.0.0
http_port = 8069

; El filtro de base de datos extrae el subdominio del cliente (%d)
; Ejemplo: avantgarde.sofiaerp.com -> sofia_tenant_avantgarde
dbfilter = ^sofia_tenant_%d$

; ------------------------------------------------------------------------------
; Multiprocesamiento y Límites de Recursos (Optimizado Baja Carga — VPS 4 GB RAM)
; ------------------------------------------------------------------------------
; 2 workers HTTP + 1 worker cron/background (~450-600 MB RAM real total)
workers = 2
max_cron_threads = 1

; Techos máximos por worker (no reservan RAM, solo reciclan ante fugas)
limit_memory_soft = 402653184
limit_memory_hard = 536870912

; Límites de tiempo de ejecución (segundos)
limit_time_cpu = 60
limit_time_real = 120
limit_request = 8192

; ------------------------------------------------------------------------------
; Rutas del Sistema y Addons Multiproducto
; ------------------------------------------------------------------------------
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/products/sofia-erp/addons,/mnt/products/sofia-erp/addons_pe,/mnt/products/sofia-erp/addons_mw,/mnt/products/industrial-services,/mnt/products/quality,/mnt/products/projects
data_dir = /var/lib/odoo

; ------------------------------------------------------------------------------
; Registro y Diagnóstico
; ------------------------------------------------------------------------------
log_level = info
log_handler = :INFO,odoo.addons.sofia_auth_bridge:INFO
