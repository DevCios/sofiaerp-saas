[options]
; ==============================================================================
; SOFIA ERP — Configuración de Seguridad y Rendimiento para Odoo 20 Community
; Multi-Tenant Shared Protected Pool
; ==============================================================================

; ------------------------------------------------------------------------------
; Conexión a Base de Datos (a través de PgBouncer)
; ------------------------------------------------------------------------------
db_host = pgbouncer
db_port = 5432
db_maxconn = 30
db_template = template1

; ------------------------------------------------------------------------------
; Seguridad de Aislamiento Multi-Tenant (Inquebrantable)
; ------------------------------------------------------------------------------
; Prohibido listar bases de datos al público exterior
list_db = False

; Modo Proxy activado para respetar cabeceras seguras de Nginx
proxy_mode = True

; El filtro de base de datos se delega a la cabecera inyectada por Nginx
dbfilter = %h

; ------------------------------------------------------------------------------
; Multiprocesamiento y Límites de Recursos (Blast Radius Isolation)
; ------------------------------------------------------------------------------
; 6 workers HTTP + 2 workers cron/background
workers = 6
max_cron_threads = 2

; Límites estrictos de memoria por worker (prevención de fugas de memoria y DoS)
limit_memory_soft = 838860800
limit_memory_hard = 1073741824

; Límites de tiempo de ejecución (segundos)
limit_time_cpu = 60
limit_time_real = 120
limit_request = 8192

; ------------------------------------------------------------------------------
; Rutas del Sistema y Addons Multiproducto
; ------------------------------------------------------------------------------
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/products/sofia-erp/addons,/mnt/products/industrial-services,/mnt/products/quality,/mnt/products/projects
data_dir = /var/lib/odoo

; ------------------------------------------------------------------------------
; Registro y Diagnóstico
; ------------------------------------------------------------------------------
log_level = info
log_handler = :INFO,odoo.addons.sofia_auth_bridge:DEBUG
logfile = False
