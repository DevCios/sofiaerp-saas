# ==============================================================================
# SOFIA ERP — PostgreSQL 16 Configuración de Alto Rendimiento Multi-Tenant
# Optimizado para Nodo VPS de 24 GB / 32 GB RAM con PgBouncer en Modo Transacción
# ==============================================================================

# Conexiones y Red
listen_addresses = '*'
max_connections = 100               # PgBouncer absorbe hasta 250 conexiones de clientes
superuser_reserved_connections = 3

# Gestión de Memoria
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 512MB
work_mem = 16MB
min_wal_size = 1GB
max_wal_size = 4GB

# Checkpoints y Escritura
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
wal_buffers = 16MB
default_statistics_target = 100

# Planificador de Consultas para SSD NVMe
random_page_cost = 1.1
effective_io_concurrency = 200

# Write-Ahead Logging (WAL) y Preparación para PITR
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'

# Registro y Diagnóstico
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 2000    # Registrar consultas lentas (> 2 segundos)
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
datestyle = 'iso, ymd'
timezone = 'UTC'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
lc_messages = 'C'
default_text_search_config = 'pg_catalog.spanish'
