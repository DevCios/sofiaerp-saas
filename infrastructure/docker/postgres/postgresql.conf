# ==============================================================================
# SOFIA ERP — PostgreSQL 16 Configuración Multi-Tenant (Baja Carga — VPS 4 GB RAM)
# Optimizado con PgBouncer en Modo Transacción
# ==============================================================================

# Conexiones y Red
listen_addresses = '*'
max_connections = 80                # PgBouncer absorbe hasta 250 conexiones de clientes
superuser_reserved_connections = 3

# Gestión de Memoria (VPS 4 GB RAM)
shared_buffers = 512MB
effective_cache_size = 1536MB
maintenance_work_mem = 128MB
work_mem = 8MB
min_wal_size = 256MB
max_wal_size = 1GB

# Checkpoints y Escritura
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
wal_buffers = 8MB
default_statistics_target = 100

# Planificador de Consultas para SSD NVMe
random_page_cost = 1.1
effective_io_concurrency = 200

# Write-Ahead Logging (WAL) — Backups gestionados por pg_dump + rclone
wal_level = replica
archive_mode = off

# Registro y Diagnóstico
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 2000    # Registrar consultas lentas (> 2 segundos)
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
datestyle = 'iso, ymd'
timezone = 'UTC'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.spanish'
