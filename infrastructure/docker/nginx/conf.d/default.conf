# ==============================================================================
# SOFIA ERP — Nginx Enrutamiento Perimetral y Protección contra Host Injection
# ==============================================================================

# Upstream hacia el Control Plane API (FastAPI)
upstream control_plane_backend {
    server control-plane-api:8000;
    keepalive 32;
}

# Upstream hacia el Runtime Pool de Odoo Community
upstream odoo_backend {
    server odoo-runtime:8069;
    keepalive 32;
}

# Servidor de Plataforma Central: api.sofiaerp.com y auth.sofiaerp.com
server {
    listen 80;
    server_name api.sofiaerp.com auth.sofiaerp.com admin.sofiaerp.com localhost;

    # Cabeceras de seguridad HTTP globales
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Enrutamiento hacia Control Plane API
    location / {
        proxy_pass http://control_plane_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}

# Servidor para Runtimes de Tenants (*.sofiaerp.com y Dominios Personalizados)
server {
    listen 80 default_server;
    server_name _;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Proxy hacia Odoo Runtime con saneamiento de dbfilter
    location / {
        proxy_pass http://odoo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Prevenir manipulación de base de datos desde la web
        # Nginx inyecta la cabecera calculada para que Odoo conecte a la BD del tenant
        proxy_set_header X-Odoo-dbfilter $http_x_odoo_tenant_db;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Optimización de contenido estático de Odoo
    location ~* /web/static/ {
        proxy_pass http://odoo_backend;
        proxy_cache_valid 200 60m;
        proxy_buffering on;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
