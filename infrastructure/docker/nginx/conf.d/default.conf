# ==============================================================================
# SOFIA ERP — Nginx Enrutamiento Perimetral y Protección contra Host Injection
# ==============================================================================

# Upstream hacia el Control Plane API (FastAPI)
upstream control_plane_backend {
    server control-plane-api:8000;
    keepalive 32;
}

# Upstream hacia el Runtime Pool de Odoo Community
upstream odoo_backend {
    server odoo-runtime:8069;
    keepalive 32;
}

# Mapeo estricto del slug de tenant desde el Host HTTP (subdominios estándar)
# Blindaje contra Host Header Injection: ignora cabeceras manipuladas por clientes.
map $http_host $calculated_odoo_dbfilter {
    default "";
    ~*^([a-z0-9_-]+)\.(?:erp\.)?sofiaerp\.com(?::\d+)?$ sofia_tenant_$1;
}

# Servidor de Plataforma Central: api.sofiaerp.com, auth.sofiaerp.com y acceso directo por IP
server {
    listen 80;
    server_name api.sofiaerp.com auth.sofiaerp.com admin.sofiaerp.com localhost ~^\d+\.\d+\.\d+\.\d+$;

    # Cabeceras de seguridad HTTP globales
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Enrutamiento directo a Odoo por IP para interfaz web, login y websockets
    location ~* ^/(web|websocket|longpolling) {
        proxy_pass http://odoo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_read_timeout 300s;
    }

    # Enrutamiento hacia Control Plane API
    location / {
        proxy_pass http://control_plane_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}

# Servidor para Runtimes de Tenants (*.sofiaerp.com y Dominios Personalizados)
server {
    listen 80 default_server;
    server_name _;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Enrutamiento directo para endpoints de API y documentación Swagger
    location /api/ {
        proxy_pass http://control_plane_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Subpetición interna para resolución de dominios personalizados en el Control Plane
    location = /_sofia_resolve_tenant {
        internal;
        proxy_pass http://control_plane_backend/api/v1/tenants/resolve/$host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
    }

    # Proxy hacia Odoo Runtime con saneamiento estricto de dbfilter
    location / {
        # Intento de resolución dinámica para dominios personalizados
        auth_request /_sofia_resolve_tenant;
        auth_request_set $dynamic_dbfilter $upstream_http_x_odoo_dbfilter;

        proxy_pass http://odoo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Inyección forzada de dbfilter validado
        proxy_set_header X-Odoo-dbfilter $dynamic_dbfilter;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Optimización de contenido estático de Odoo
    location ~* /web/static/ {
        proxy_pass http://odoo_backend;
        proxy_cache_valid 200 60m;
        proxy_buffering on;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
