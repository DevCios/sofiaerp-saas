name: Build POS Express (.exe Windows + .apk Android)

on:
  workflow_dispatch:
  push:
    tags:
      - 'pos-v*'

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Windows x64 Installer (.exe NSIS)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pos-express-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Generate Tauri icons (.ico / .png)
        run: npx tauri icon www/icon.png
      - name: Build Windows NSIS Setup (.exe)
        run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: POS-Express-Windows-x64-Setup
          path: pos-express-app/src-tauri/target/release/bundle/nsis/*.exe

  build-android-apk:
    name: Android App (.apk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-express-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Initialize Capacitor Android project
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          npx cap add android
          npx cap sync android
      - name: Build Android APK
        working-directory: pos-express-app/android
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=${SDK_DIR}" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../POS-Express-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: POS-Express-Android-APK
          path: pos-express-app/POS-Express-Android.apk

  publish-release:
    if: startsWith(github.ref, 'refs/tags/pos-v')
    needs: [build-windows-exe, build-android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/POS-Express-Windows-x64-Setup/*.exe
            dist/POS-Express-Android-APK/*.apk
